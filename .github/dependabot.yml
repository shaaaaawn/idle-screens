# Dependabot — free on public + private. Version + security update PRs.
# Grouped to keep PR noise low; batch at your own pace.
version: 2
updates:
  - package-ecosystem: npm # covers the pnpm workspace (pnpm-lock.yaml)
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      prod-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
    # Majors that are blocked by a peer range, not by preference. Each was
    # attempted, found impossible, and closed with evidence — without these
    # rules Dependabot reopens all three every week. Drop the matching entry
    # (don't just merge past it) once the blocker below clears.
    ignore:
      # vitest@3 depends on vite "^5 || ^6 || ^7.0.0-0". Taking vite 8 either
      # fails to resolve or strands vitest on a second copy — and the whole unit
      # suite plus the Playwright e2e run ride on that peer.
      # Unblocks when: vitest 4 lands. vite and vitest must move together.
      - dependency-name: vite
        update-types: [version-update:semver-major]
      # @types/node describes the Node API surface; this repo pins Node 22
      # (engines.node >=22, node-version: 22 in every workflow). Types running
      # ahead of the runtime means tsc accepts calls that throw in production —
      # a worse failure than being slightly behind.
      # Unblocks when: the pinned Node version moves. Bump them in lockstep.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)
