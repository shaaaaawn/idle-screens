# CodeQL SAST — free on this public repo. Scans JS/TS on PR, on push to main,
# and weekly (catches newly-published queries against unchanged code).
name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 9 * * 1' # Mondays 09:00 UTC

permissions:
  contents: read
  security-events: write # required to upload results to the Security tab

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      # No build step: CodeQL analyzes the TS sources directly (no compiled
      # artifact needed for the JS/TS extractor).
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
