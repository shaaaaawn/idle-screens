# Dependency review — free on this public repo. Blocks a PR that adds a
# known-vulnerable dependency (or a disallowed license) before it merges.
name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    # Same-repo only: a fork can name its branch changeset-release/main, so the
    # branch name alone must not be enough to skip this job.
    if: ${{ github.event_name != 'pull_request' || github.head_ref != 'changeset-release/main' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high # block only high/critical; tune as desired
