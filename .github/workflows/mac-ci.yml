name: Mac CI

# apps/mac had no CI at all: 40 Swift tests existed and nothing ran them until a
# release tag was pushed, by which point a break is discovered at the worst
# moment. This mirrors linux-ci.yml — compile and test on every change.
on:
  push:
    branches: [main]
    paths:
      - 'apps/mac/**'
      # The web bundle imports these workspace packages, so a change to any of
      # them can break the bundle or the Swift app that embeds it.
      - 'packages/core/**'
      - 'packages/capabilities/**'
      - 'packages/saver-metaquarium/**'
      - 'packages/savers-classic/**'
      - 'packages/schema/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/mac-ci.yml'
  pull_request:
    branches: [main]
    # Workspace package bundling for apps/mac/web is verified on Linux in ci.yml
    # on every PR, so PRs only need a macos-26 runner when apps/mac/ itself
    # changes. push: main above still exercises the full Swift + universal build
    # whenever a workspace dependency changes.
    paths:
      - 'apps/mac/**'
      - '.github/workflows/mac-ci.yml'

concurrency:
  group: mac-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    # Same-repo only: a fork can name its branch changeset-release/main, so the
    # branch name alone must not be enough to skip this job.
    if: ${{ github.event_name != 'pull_request' || github.head_ref != 'changeset-release/main' || github.event.pull_request.head.repo.full_name != github.repository }}
    name: Build & test (macOS)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # The web bundle is part of the app, so a break here is a break in the
      # product even though it never reaches the Swift compiler.
      - name: Build workspace packages
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build mac web bundle
        working-directory: apps/mac/web
        run: node build.mjs

      - name: swift build
        working-directory: apps/mac
        run: swift build

      - name: swift test
        working-directory: apps/mac
        run: swift test

      # Guard the release path on main merges, not on every PR push. A universal
      # build is what mac-release.yml ships, and it fails differently from a host
      # build (different output path, different link step) — running it on push
      # to main catches regressions before a tag without doubling PR runner time.
      - name: Universal release build (what the DMG ships)
        if: ${{ github.event_name == 'push' }}
        working-directory: apps/mac
        run: |
          swift build -c release --arch arm64 --arch x86_64
          BIN=.build/apple/Products/Release/IdleScreens
          archs=$(lipo -archs "$BIN")
          echo "architectures: $archs"
          for want in arm64 x86_64; do
            case " $archs " in *" $want "*) ;;
              *) echo "::error::universal binary is missing $want (got: $archs)"; exit 1 ;;
            esac
          done
