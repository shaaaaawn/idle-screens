name: Mac Release

# Tag a release as mac-vX.Y.Z to build, sign, notarize, and publish the DMG.
on:
  push:
    tags:
      - 'mac-v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Mirrors linux-release.yml. tag-release.sh defaults the version from
      # Info.plist, but it accepts an override and nothing stops a hand-rolled
      # `git tag mac-v9.9.9` — which would publish a DMG whose Info.plist says
      # something else, with no error anywhere.
      - name: Validate tag against Info.plist
        id: ver
        run: |
          plist_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' apps/mac/Info.plist)"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            tag_version="${GITHUB_REF_NAME#mac-v}"
            if [[ "$tag_version" != "$plist_version" ]]; then
              echo "::error::tag mac-v$tag_version does not match apps/mac/Info.plist version $plist_version — bump Info.plist before tagging"
              exit 1
            fi
            echo "version=$tag_version" >> "$GITHUB_OUTPUT"
          else
            echo "version=$plist_version" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Build workspace packages
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build mac web bundle
        working-directory: apps/mac/web
        run: node build.mjs

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PWD" build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PWD" build.keychain
          rm cert.p12

      - name: Store notarytool credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials idle-notary \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"

      - name: Sign, notarize, staple
        working-directory: apps/mac
        env:
          DEVELOPER_ID: ${{ secrets.MACOS_DEVELOPER_ID }}
          NOTARY_PROFILE: idle-notary
        run: ./scripts/notarize.sh

      # The DMG is the artifact users get; confirm it is actually universal
      # before publishing rather than after an Intel user reports it will not
      # open.
      - name: Verify the shipped binary is universal
        working-directory: apps/mac
        run: |
          mkdir -p /tmp/dmg
          hdiutil attach dist/IdleScreens.dmg -mountpoint /tmp/dmg -nobrowse -quiet
          archs=$(lipo -archs /tmp/dmg/IdleScreens.app/Contents/MacOS/IdleScreens)
          hdiutil detach /tmp/dmg -quiet
          echo "architectures: $archs"
          for want in arm64 x86_64; do
            case " $archs " in *" $want "*) ;;
              *) echo "::error::DMG binary is missing $want (got: $archs)"; exit 1 ;;
            esac
          done

      - name: Publish DMG to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('mac-v{0}', steps.ver.outputs.version) }}
          name: idle-screens ${{ steps.ver.outputs.version }} (macOS)
          draft: ${{ github.ref_type != 'tag' }}
          files: apps/mac/dist/IdleScreens.dmg
          fail_on_unmatched_files: true
          generate_release_notes: true
