name: Release

# On push to main:
#   1) Product merge (has pending changesets) → slim CI (no e2e) → open
#      "chore: version packages" PR → auto-merge it → publish in this same run.
#   2) Version-packages commit (metadata only) → skip CI → publish (idempotent
#      if step 1 already published; covers human merges / retries).
#
# Auth: prefer npm Trusted Publishing (OIDC). Keep secrets.NPM_TOKEN as a
# temporary fallback until every @idle-screens/* package has a Trusted Publisher
# pointing at this workflow filename (release.yml). See CLAUDE.md § Releasing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      is_version: ${{ steps.classify.outputs.is_version }}
    steps:
      - uses: actions/checkout@v7
      - id: classify
        run: |
          subject=$(git log -1 --pretty=%s)
          body=$(git log -1 --pretty=%b)
          echo "head_subject=$subject"
          # Merge commits are "Merge pull request #N …", not the inner
          # "chore: version packages" subject — match either.
          if [[ "$subject" == "chore: version packages"* ]] \
            || [[ "$subject" == "Version Packages"* ]] \
            || [[ "$subject$body" == *"version packages"* ]]; then
            echo "is_version=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_version=false" >> "$GITHUB_OUTPUT"
          fi

  # Product merges already had full CI (incl. e2e) on the PR. Re-running e2e
  # here was the ~10–15m tax paid twice per release. Version commits skip CI.
  ci:
    needs: classify
    if: needs.classify.outputs.is_version != 'true'
    uses: ./.github/workflows/ci.yml
    with:
      skip_e2e: true

  release:
    needs: [classify, ci]
    if: always() && (needs.classify.outputs.is_version == 'true' || needs.ci.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Need a token that can push/merge and (ideally) re-trigger workflows.
          # RELEASE_GITHUB_TOKEN is optional — without it, GITHUB_TOKEN still
          # merges the version PR, and we publish in THIS run (GITHUB_TOKEN
          # merges do not re-fire workflows).
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm >= 11.5.1 (Node 22 ships older).
      # Pin: `npm@latest` (11.6+) rejects `--git-checks`, which changesets
      # still passes, and the publish dies with EUNKNOWNCONFIG.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@11.5.1

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Configure npm auth (OIDC or legacy token)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "Using secrets.NPM_TOKEN (legacy fallback)."
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> "$npmrc"
          else
            echo "Using npm Trusted Publishing (OIDC) — no long-lived token."
            # setup-node may write a blank _authToken that blocks OIDC detection.
            if [ -f "$npmrc" ]; then
              sed -i '/_authToken/d' "$npmrc"
            fi
          fi

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          title: "chore: version packages"
          commit: "chore: version packages"
          # Prefer a PAT/app token so the merged version commit can also fire
          # Pages/CI; fall back to GITHUB_TOKEN + same-run publish below.
          github-token: ${{ secrets.RELEASE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          # Empty string (not unset) so changesets/action doesn't invent a
          # broken token path when relying on OIDC.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN || '' }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || '' }}
          NPM_CONFIG_PROVENANCE: "true"

      # Auto-merge the mechanical version PR so humans aren't the second gate.
      # Then publish in this same run — required when using GITHUB_TOKEN because
      # merges performed with it do not trigger a new workflow run.
      - name: Auto-merge version packages PR
        id: automerge
        if: steps.changesets.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          PR: ${{ steps.changesets.outputs.pr-number }}
        run: |
          set -euo pipefail
          echo "Auto-merging version packages PR #$PR"
          gh pr merge "$PR" --merge --delete-branch
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Publish after version merge (same run)
        id: same_run_publish
        if: steps.automerge.outputs.merged == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN || '' }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || '' }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          pnpm install --frozen-lockfile
          pnpm build
          pnpm changeset publish
          echo "published=true" >> "$GITHUB_OUTPUT"

      # Product half: ping idle-server to bump floors + regen SCHEMA_REFERENCE +
      # push main (Deploy ships). Needs IDLE_SERVER_DISPATCH_TOKEN (PAT with
      # repo scope on idle-server). Soft-skip when unset so Release still greens.
      - name: Dispatch idle-server consume
        if: steps.changesets.outputs.published == 'true' || steps.same_run_publish.outputs.published == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.IDLE_SERVER_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::No IDLE_SERVER_DISPATCH_TOKEN — skip auto-consume."
            echo "Manual: scripts/release.sh sync-server --smoke --commit --push"
            exit 0
          fi
          gh api repos/shaaaaawn/idle-server/dispatches \
            --method POST \
            -f event_type='idle-screens-published' \
            -f 'client_payload[reason]=idle-screens-release'
          echo "Dispatched idle-screens-published → idle-server Consume workflow"
