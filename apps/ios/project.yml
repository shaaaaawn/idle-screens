name: IdleScreens
options:
  bundleIdPrefix: com.hermosalabs
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  IdleScreens:
    type: application
    platform: iOS
    sources:
      - IdleScreens
    settings:
      base:
        INFOPLIST_FILE: IdleScreens/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.hermosalabs.idlescreens
        MARKETING_VERSION: "1.0.0"
        # Date-based build number (YYYYMMDDnn): monotonic by construction, so a
        # later rebuild is always accepted without having to remember what the
        # last uploaded build was.
        CURRENT_PROJECT_VERSION: "2026080702"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Z4P3N45225
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: IdleScreens/IdleScreens.entitlements
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Idle Screens App Store v3"
    info:
      path: IdleScreens/Info.plist
      properties:
        CFBundleDisplayName: idle screens
        CFBundleName: IdleScreens
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # iPad: all orientations — required for multitasking support.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # TV pairing: camera for the QR scanner, plus a custom scheme fallback
        # for the https://idlescreens.com/pair/<code> universal link.
        NSCameraUsageDescription: Scan the pairing code shown on your Apple TV.
        CFBundleURLTypes:
          - CFBundleURLName: com.hermosalabs.idlescreens.pair
            CFBundleURLSchemes:
              - idlescreens

  IdleScreensTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - IdleScreensTests
    dependencies:
      - target: IdleScreens
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/IdleScreens.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/IdleScreens"
        BUNDLE_LOADER: "$(TEST_HOST)"

  IdleScreensTV:
    type: application
    platform: tvOS
    sources:
      - IdleScreensTV
      - path: IdleScreens/API
      - path: IdleScreens/Theme
      - path: IdleScreens/Render
      - path: IdleScreens/Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: IdleScreensTV/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.hermosalabs.idlescreens
        MARKETING_VERSION: "1.0.0"
        # Date-based build number (YYYYMMDDnn): monotonic by construction, so a
        # later rebuild is always accepted without having to remember what the
        # last uploaded build was.
        CURRENT_PROJECT_VERSION: "2026080702"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Z4P3N45225
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Idle Screens tvOS App Store"
    info:
      path: IdleScreensTV/Info.plist
      properties:
        CFBundleDisplayName: idle screens
        CFBundleName: IdleScreensTV
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false

  IdleScreensTVTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - IdleScreensTVTests
    dependencies:
      - target: IdleScreensTV
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/IdleScreensTV.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/IdleScreensTV"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  IdleScreens:
    build:
      targets:
        IdleScreens: all
        IdleScreensTests: [test]
    run:
      config: Debug
      environmentVariables:
        IDLE_SCREENS_BASE_URL: "https://idlescreens.com"
    test:
      config: Debug
      targets:
        - IdleScreensTests
    profile:
      config: Release
    analyze:
      config: Debug

  IdleScreensTV:
    build:
      targets:
        IdleScreensTV: all
        IdleScreensTVTests: [test]
    run:
      config: Debug
      environmentVariables:
        IDLE_SCREENS_BASE_URL: "https://idlescreens.com"
    test:
      config: Debug
      targets:
        - IdleScreensTVTests
    profile:
      config: Release
    analyze:
      config: Debug
